x-backend: &backend
  build: .
  image: gemstone-backend:local
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gemstone_auth

services:
  postgres:
    image: postgres:17-alpine
    container_name: gemstone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gemstone_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gemstone_auth"]
      interval: 3s
      timeout: 3s
      retries: 20

  init:
    <<: *backend
    command: ["python", "docker_init.py"]
    depends_on:
      postgres:
        condition: service_healthy

  auth-api:
    <<: *backend
    command: ["python", "-m", "uvicorn", "auth_service.main:app", "--app-dir", "services/auth-service/src", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  gemstone-api:
    <<: *backend
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
    postgres_data:
